{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="py-5 my-auto text-center">
    <div class="container py-5">
        <div class="col-lg-6 mx-auto">
            <span class="display-1 fw-extrabold text-primary d-block font-monospace">404</span>
            <h1 class="h2 fw-bold mb-3">Page Not Found</h1>
            <p class="text-secondary mb-4">
                The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'home' %}" class="btn btn-primary-custom px-4 py-2">
                    <i class="bi bi-house-door me-2"></i> Return Home
                </a>
                <a href="{% url 'projects' %}" class="btn btn-outline-custom px-4 py-2">
                    <i class="bi bi-folder me-2"></i> Browse Projects
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
